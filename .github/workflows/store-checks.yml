name: WarLike Asset Store checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify JavaScript syntax
        run: |
          node --check asset-variants.js
          node --check catalog-bundled.js
      - name: Run Store tests
        run: npm test

      - name: Build and verify deployable Store assets
        run: |
          npm run build
          test -f dist/assets/free/warlike-genre-packs/models.json
          test -f dist/assets/free/warlike-genre-packs/sprites.json
          test -f dist/assets/free/warlike-genre-packs/tactical-01.glb
          test -f dist/assets/free/warlike-genre-packs/tactical-01.png
