<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarLike · Validation des assets 3D</title><style>
:root{font-family:system-ui;color-scheme:dark;background:#0d1320;color:#eef2ff}*{box-sizing:border-box}body{margin:0}main{max-width:1800px;margin:auto;padding:25px}a{color:#b6a5ff}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:17px 0}.btn,input,select{font:inherit;background:#28354b;color:white;border:1px solid #566883;border-radius:9px;padding:10px;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{background:#182238;border:1px solid #344562;padding:12px;border-radius:14px;min-width:0}.card h3{font-size:14px;margin:0 0 7px;overflow-wrap:anywhere}.card model-viewer{display:block;width:100%;height:225px;background:radial-gradient(#455270,#1e293e);border-radius:8px}.card p{font-size:12px;line-height:1.5;color:#c6d2e8;overflow-wrap:anywhere}.card select{max-width:100%;width:100%}.card .tools{margin:6px 0;gap:6px}.card .tools button{font-size:12px;padding:7px}.tag{font-size:11px;font-weight:700;color:#a6e5d3}.warn{color:#ffcb94!important}.error{color:#ff9a9a!important}.pass{color:#a6e5d3!important}.muted{color:#9fb0cc}.card img{width:100%;height:225px;object-fit:contain}#status{min-height:20px}#filters{max-width:250px}@media(max-width:650px){main{padding:14px}}</style></head><body><main><p><a href="./index.html">← Store</a> · <a href="./3d-departments.html?section=animations">Animations</a></p><h1>Validation des assets GLB</h1><p>Audit des vrais fichiers du Store, lecture visuelle des clips et suivi de validation humaine. Une validation structurelle n’équivaut pas à une confirmation du rendu dans WarLike Engine.</p>
<div class="tools"><button id="start" class="btn">Analyser tous les GLB</button><button id="stop" class="btn" disabled>Arrêter</button><button id="export" class="btn">Exporter le rapport JSON</button><select id="filters"><option value="all">Tous les résultats</option><option value="animated">Avec animations</option><option value="invalid">À corriger</option><option value="review">À valider visuellement</option><option value="approved">Visuellement approuvés</option></select></div><p id="status" role="status"></p><div id="cards" class="grid"></div></main><script type="module">
import {loadBundledCatalog} from './catalog-bundled.js';
import {inspectGlbAnimations} from './animation-audit.js';
import {inspectModelColors} from './material-preview.js';
const $=id=>document.getElementById(id);const state=new Map();let assets=[],cancel=false,viewerReady=null;
function safeKey(id){return 'warlike.asset.visual-review.v1.'+id}
function review(id){try{return JSON.parse(localStorage.getItem(safeKey(id))||'null')}catch{return null}}
function setReview(id,approved){const value={approved,reviewedAt:new Date().toISOString(),method:'human-model-viewer'};localStorage.setItem(safeKey(id),JSON.stringify(value));render()}
function applicable(a,item){const filter=$('filters').value;const result=state.get(a.id);
 if(filter==='animated')return a.animationClips>0||result?.animation.clips.length>0;
 if(filter==='invalid')return !!result?.error||!!result?.animation.invalid||!!result?.manifestMismatch;
 if(filter==='review')return !review(a.id)?.approved;
 if(filter==='approved')return review(a.id)?.approved===true;
 return true}
function status(){const done=[...state.values()];const failed=done.filter(x=>x.error||x.animation?.invalid||x.manifestMismatch).length;const approved=assets.filter(a=>review(a.id)?.approved).length;$('status').textContent=done.length+'/'+assets.length+' fichiers analysés · '+failed+' à corriger · '+approved+' approuvés visuellement sur cet appareil.'}
async function prepareViewer(){if(customElements.get('model-viewer'))return;if(!viewerReady)viewerReady=import('https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js').then(()=>customElements.whenDefined('model-viewer')).catch(e=>{viewerReady=null;throw e});await viewerReady}
function card(a){
 const box=document.createElement('article');box.className='card';const heading=document.createElement('h3');heading.textContent=a.name;box.append(heading);
 const tag=document.createElement('div');tag.className='tag';tag.textContent=a.author+' · '+a.packName;box.append(tag);
 const result=state.get(a.id),info=document.createElement('p');
 if(!result)info.textContent='Pas encore analysé · '+a.animationClips+' clip(s) déclarés';
 else if(result.error){info.textContent='Erreur GLB : '+result.error;info.className='error'}
 else{info.textContent=result.animation.clips.length+' clip(s) dans le GLB, '+result.animation.valid+' structurellement valide(s). '+(result.manifestMismatch?'⚠ Nombre de clips différent du manifeste. ':'')+(result.animation.invalid?'⚠ '+result.animation.invalid+' clips invalides. ':'')+(result.colors.warning?'⚠ '+result.colors.warning:'');info.className=result.animation.invalid||result.manifestMismatch?'warn':'pass'}
 box.append(info);
 const visual=document.createElement('div');if(a.thumb){const img=document.createElement('img');img.src=a.thumb;img.loading='lazy';img.alt='Miniature de '+a.name;visual.append(img)}box.append(visual);
 const controls=document.createElement('div');controls.className='tools';
 const view=document.createElement('button');view.className='btn';view.textContent='Ouvrir la vue 3D';
 const approve=document.createElement('button');approve.className='btn';approve.textContent=review(a.id)?.approved?'✓ Approuvé':'Marquer vérifié';approve.disabled=!result||!!result.error;
 const issue=document.createElement('button');issue.className='btn';issue.textContent='Signaler défaut';
 view.onclick=async()=>{view.disabled=true;try{await prepareViewer();visual.replaceChildren();const player=document.createElement('model-viewer');player.src=a.url;player.setAttribute('camera-controls','');player.setAttribute('environment-image','neutral');player.setAttribute('shadow-intensity','1');player.setAttribute('auto-rotate','');player.setAttribute('alt',a.name);visual.append(player);if(result?.animation.clips.length){const select=document.createElement('select');for(const clip of result.animation.clips)select.append(new Option(clip.name,clip.name));select.onchange=()=>{player.animationName=select.value;player.play({repetitions:Infinity})};player.addEventListener('load',()=>{if(player.availableAnimations?.length){select.replaceChildren(...player.availableAnimations.map(name=>new Option(name,name)));player.animationName=select.value;player.play({repetitions:Infinity})}});const row=document.createElement('div');row.className='tools';const play=document.createElement('button');play.textContent='Lecture';const pause=document.createElement('button');pause.textContent='Pause';play.onclick=()=>player.play({repetitions:Infinity});pause.onclick=()=>player.pause();row.append(play,pause);visual.append(select,row)}}catch(e){info.textContent='Lecteur 3D : '+e.message;info.className='error'}finally{view.disabled=false}};
 approve.onclick=()=>setReview(a.id,true);issue.onclick=()=>setReview(a.id,false);controls.append(view,approve,issue);box.append(controls);
 const stateLine=document.createElement('p');stateLine.className='muted';const r=review(a.id);stateLine.textContent=r?.approved?'Validation visuelle locale : '+r.reviewedAt:r?'Défaut signalé · '+r.reviewedAt:'Validation visuelle non réalisée';box.append(stateLine);return box
}
function render(){const root=$('cards');root.replaceChildren();for(const a of assets.filter(applicable).slice(0,250))root.append(card(a));status()}
async function analyze(){cancel=false;$('start').disabled=true;$('stop').disabled=false;for(const a of assets){if(cancel)break;try{const response=await fetch(a.url,{credentials:'same-origin'});if(!response.ok)throw Error('HTTP '+response.status);const length=Number(response.headers.get('content-length')||0);if(length>32*1024*1024)throw Error('GLB > 32 Mo');const buffer=await response.arrayBuffer();if(buffer.byteLength>32*1024*1024)throw Error('GLB > 32 Mo');const animation=inspectGlbAnimations(buffer),colors=inspectModelColors(buffer);state.set(a.id,{animation,colors,manifestMismatch:a.animationClips!==animation.clips.length})}catch(e){state.set(a.id,{error:e.message})}if(state.size%10===0)render()}$('start').disabled=false;$('stop').disabled=true;render()}
$('start').onclick=analyze;$('stop').onclick=()=>{cancel=true};$('filters').onchange=render;
$('export').onclick=()=>{const results=assets.map(a=>({id:a.id,name:a.name,author:a.author,pack:a.pack,declaredClips:a.animationClips,audit:state.get(a.id)||null,visualReview:review(a.id)||null,engineCompatibility:'non vérifiée : nécessite import Library → Engine + Play/Export'}));const blob=new Blob([JSON.stringify({schema:'warlike.asset.qa.v1',generatedAt:new Date().toISOString(),results},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='warlike-assets-qa.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),10000)};
try{const result=await loadBundledCatalog();assets=result.assets;render()}catch(e){$('status').textContent='Catalogue inaccessible : '+e.message}
</script></body></html>
